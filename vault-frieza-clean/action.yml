name: 'Vault with Frieza Cleanup'
description: 'Log in to Vault, fetch Outscale credentials, initialize Frieza, and auto-revoke the Vault token at job completion.'

inputs:
  vault_url:
    description: 'The URL for the Vault endpoint'
    required: false
    default: 'http://127.0.0.1:8200/'
  vault_role:
    description: 'Vault role for JWT/OIDC auth method'
    required: true
  vault_path:
    description: 'The Vault path for the auth method'
    required: false
    default: 'github-action'
  clean_timeout:
    description: 'Timeout when cleaning resources.'
    required: false
    default: '15m'
  error_on_dirty:
    description: 'Exit in error when the account is not clean.'
    required: false
    default: 'false'
  ignore_cleanup_failure:
    description: 'Ignore cleanup failures and continue.'
    required: false
    default: 'false'
  providers:
    description: 'List of systems (comma-separated: outscale_oapi,outscale_oos,outscale_oks,...).'
    required: false
    default: 'outscale_oapi'
  exclude_resource_types:
    description: Remove all except theses resource types (separated by ','). You can see all resource types in the description of the provider.
    required: false
  bypass_deletion_protection:
    description: 'Disable API deletion protection before deleting supported resources.'
    required: false
    default: 'false'
  osc_account:
    description: "Account alias to target"
    required: false
  vault_creds_type:
    description: "type of role"
    required: false
    default: "root-creds"

outputs:
  access_key:
    description: "ak"
    value: ${{ steps.import-secrets.outputs.access_key }}
  secret_key:
    description: "sk"
    value: ${{ steps.import-secrets.outputs.secret_key }}
  region:
    description: "Outscale region used"
    value: ${{ steps.import-secrets.outputs.region }}
  account_id:
    description: "Outscale account id"
    value: ${{ steps.import-secrets.outputs.account_id }}
  osc_account:
    description: "Account alias used"
    value: ${{ steps.account.outputs.osc_account }}

runs:
  using: 'composite'
  steps:
    - name: 🔎 Configure osc_account
      id: account
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          if (process.env.OSC_ACCOUNT_INPUT != "") {
            const account = process.env.OSC_ACCOUNT_INPUT
            core.info(`Using ${account} account from inputs`)
            core.setOutput('osc_account', account);
          } else if (process.env.OSC_ACCOUNT != "") {
            const account = process.env.OSC_ACCOUNT
            core.info(`Using ${account} account from env`)
            core.setOutput('osc_account', account);
          } else {
            core.setFailed('osc_account is not configured properly')
          }
      env:
        OSC_ACCOUNT_INPUT: ${{ inputs.osc_account }}
    - name: 🔒️ Import Secrets from Vault
      id: import-secrets
      uses: outscale/.github/vault@vault_action
      with:
        vault_url: ${{ inputs.vault_url }}
        vault_path: ${{ inputs.vault_path }}
        vault_role: ${{ inputs.vault_role }}
        vault_creds_type : ${{ inputs.vault_creds_type }}
        osc_account: ${{ steps.account.outputs.osc_account }}

    - name: 🧹 Register Frieza Clean
      uses: outscale/frieza-github-actions/frieza-clean@d361dd8cc864cfb9575429ee54fde4a0e8e7b124 # v0.17.2
      with:
        access_key: ${{ steps.import-secrets.outputs.access_key }}
        secret_key: ${{ steps.import-secrets.outputs.secret_key }}
        region: ${{ steps.import-secrets.outputs.region }}
        clean_timeout: ${{ inputs.clean_timeout }}
        error_on_dirty: ${{ inputs.error_on_dirty }}
        ignore_cleanup_failure: ${{ inputs.ignore_cleanup_failure }}
        providers: ${{ inputs.providers }}
        exclude_resource_types: ${{ inputs.exclude_resource_types }}
        bypass_deletion_protection: ${{ inputs.bypass_deletion_protection }}
        post_script: |
          curl -XPOST \
            --retry 3 \
            --retry-all-errors \
            --retry-max-time 60 \
            -H "X-Vault-Token: ${{ steps.import-secrets.outputs.vault_token }}" \
            ${{ inputs.vault_url }}/v1/auth/token/revoke-self
