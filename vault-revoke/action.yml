name: 'Revoke Vault token'

inputs:
  vault_url:
    description: 'The URL for the Vault endpoint'
    required: false
    default: 'http://127.0.0.1:8200/'
  vault_token:
    description: "Vault token"
    required: true

runs:
  using: 'composite'
  steps:
    - name: 🔒️ Revoke vault token
      shell: bash
      run: |
        curl -XPOST \
          --silent --show-error \
          --retry 3 \
          --retry-all-errors \
          --retry-max-time 60 \
          -H "X-Vault-Token: ${{ inputs.vault_token }}" \
          ${{ inputs.vault_url }}/v1/auth/token/revoke-self
