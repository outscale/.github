name: 👷 Deploy a cluster
description: This action bootstraps a Kube cluster using Cluster API.
inputs:
  OSC_REGION:
    description: 'cluster region'
    required: true
  CLUSTER_NAME:
    description: 'cluster name'
    required: true
  IMAGE_NAME:
    description: 'image name'
    required: true
  IMAGE_ACCOUNT_ID:
    description: 'image account id'
    default: ""
  OSC_VM_TYPE:
    description: 'VM type'
    default: "tinav6.c4r8p2"
  WORKER_COUNT:
    description: 'number of worker nodes'
    default: "1"
  CCM:
    description: 'deploy CCM'
    default: "true"
  PRELOADER_SNAPSHOT:
    description: 'take a preloader snapshot'
    default: false
  PRELOADER_IMAGE:
    description: 'preloader image'
    default: "outscale/k8s-image-preloader"
  PRELOADER_VERSION:
    description: 'preloader image version'
    default: "v0.3.0"
  CERT_MANAGER:
    description: 'deploy cert-manager'
    default: "false"
  KUSTOMIZE_PATH:
    description: 'path of kustomization config'
  ALLOW_FROM:
    description: 'Additional IP range to allow'
  vault_role:
    description: 'Vault role for JWT/OIDC auth method'
    required: true
  vault_token:
    description: 'existing vault token'
    required: true
outputs:
  SNAPSHOT_ID:
    description: "ID of the preloader snapshot"
    value: ${{ steps.snapshot.outputs.SNAPSHOT_ID }}

runs:
  using: 'composite'
  steps:
    - name: 🩹 Safe config for 💩 DNS
      shell: bash
      run: |
        sed 's/options /options use-vc single-request attempts:5 /' < /etc/resolv.conf > /etc/resolv.conf.new
        cat /etc/resolv.conf.new > /etc/resolv.conf
    - name: 🔒️ Import Secrets from Vault
      id: import-secrets
      uses: outscale/.github/vault-additional@a638a6d32db53dbde3f17c70894138535b57fadb # main
      with:
        vault_role: ${{ inputs.vault_role }}
        osc_account: birch
        vault_token: ${{ inputs.vault_token }}
    - name: ⬇️ Setup clusterctl
      shell: bash
      run: |
        curl -sSL --retry 5 --retry-all-errors https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.10.10/clusterctl-linux-amd64 -o clusterctl && install clusterctl /usr/local/bin/clusterctl
    - name: 👷 Deploy management cluster
      id: cluster
      shell: bash
      run: |
        ${{ github.action_path }}/setup.sh
      env:
        ACTION_PATH: ${{ github.action_path }}
        OKS_ACCESS_KEY: ${{ steps.import-secrets.outputs.access_key }}
        OKS_SECRET_KEY: ${{ steps.import-secrets.outputs.secret_key }}
        OKS_REGION: ${{ steps.import-secrets.outputs.region }}
        OSC_REGION: ${{ inputs.OSC_REGION }}
        OSC_CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}
        OSC_IMAGE_NAME: ${{ inputs.IMAGE_NAME }}
        IMAGE_ACCOUNT_ID: ${{ inputs.IMAGE_ACCOUNT_ID }}
        OSC_VM_TYPE: ${{ inputs.OSC_VM_TYPE }}
        WORKER_COUNT: ${{ inputs.WORKER_COUNT }}
        CCM: ${{ inputs.CCM }}
        CERT_MANAGER: ${{ inputs.CERT_MANAGER }}
        KUSTOMIZE_PATH: ${{ inputs.KUSTOMIZE_PATH }}
        OSC_ALLOW_FROM_DEV: ${{ inputs.ALLOW_FROM }}
    - name: 📸 Preloader snapshot
      id: snapshot
      if: ${{ inputs.PRELOADER_SNAPSHOT == 'true' }}
      shell: bash
      run: |
        ${{ github.action_path }}/snapshot.sh
      env:
        KUBECONFIG : ${{ github.workspace }}/workload.kubeconfig
        ACTION_PATH: ${{ github.action_path }}
        PRELOADER_IMAGE: "${{ inputs.PRELOADER_IMAGE }}:${{ inputs.PRELOADER_VERSION }}"
        OSC_REGION: ${{ inputs.OSC_REGION }}
