version: "2.0"
github:
  controls:
    # ===========================================
    # Actions must be pinned by commit SHA
    # ===========================================
    # Flags workflow steps whose `uses:` reference is not a 40-character
    # commit SHA. Tag/branch refs (v4, main) are mutable: if the action's
    # maintainer is compromised or retags a release, the caller workflow
    # silently runs new code with its secrets. This is the vector behind
    # the tj-actions/changed-files compromise (CVE-2025-30066).
    #
    # trustedOwners exempts first-party (`actions/*`, `github/*`) actions so
    # the initial signal on a fresh repo stays focused on the third-party
    # surface. Pair with Dependabot (`version-update-strategy: sha-and-version`)
    # to keep pins fresh.
    actionsMustBePinnedByCommitSha:
      enabled: true
      # Action-owner prefixes exempt from the pin-by-SHA requirement.
      # Only list owners already inside the workflow's trust boundary.
      trustedOwners:
        - outscale

    # ===========================================
    # Actions must come from authorized sources
    # ===========================================
    # Restrict which `uses:` action sources are allowed. Every third-party
    # action runs with the caller workflow's token and secrets, so limiting
    # actions to vetted publishers shrinks the supply-chain surface — the
    # tj-actions / reviewdog vector (CVE-2025-30066) started exactly there.
    #
    # This ships a deliberately BROAD, first-run-friendly profile:
    #   • GitHub-official (`actions/*`, `github/*`)          → trusted
    #   • same-org actions (owner == scanned repo's owner)   → trusted
    #   • any action whose repo has ≥ 20k stars              → trusted
    #     (star check needs GitHub API access; without a token it is skipped,
    #      so the allowlist below is what protects token-less runs)
    #   • plus the curated allowlist of well-known publishers below.
    # Org-scoped wildcards (`owner/*`) only; never a bare `*`. Tighten
    # (lower minimumStars, prune the allowlist) for stricter org policies.
    githubActionMustComeFromAuthorizedSources:
      enabled: true
      trustGithubOfficialActions: true # actions/* and github/*
      trustSameOrgActions: true # action owner == scanned repo owner
      minimumStars: 20000 # popular-by-adoption floor (requires API access)
      # Owner matching is literal and CASE-SENSITIVE, so mixed-case orgs are
      # listed in both their canonical and lowercase forms.
      trustedGithubActions:
          # ── Plumber ─────────────────────────────────────────────────
          - getplumber/plumber # Plumber's own GitHub Action

          # ── Docker / container builds ───────────────────────────────
          - docker/setup-qemu-action # Multi-architecture build support
          - docker/setup-buildx-action # Docker Buildx
          - docker/login-action # Container registry authentication
          - docker/metadata-action # Image tags and metadata
          - docker/build-push-action # Build and push container images

          # ── Security / supply chain ─────────────────────────────────
          - ossf/scorecard-action # OpenSSF Scorecard
          - aquasecurity/trivy-action # Vulnerability scanning with Trivy
          - anchore/scan-action # Vulnerability scanning with Anchore
          - anchore/sbom-action # SBOM generation with Syft
          - sigstore/cosign-installer # Install Cosign

          # ── Kubernetes ──────────────────────────────────────────────
          - azure/setup-kubectl # Install kubectl
          - azure/setup-helm # Install Helm

          # ── Infrastructure as Code ──────────────────────────────────
          - hashicorp/setup-terraform # Install Terraform
          - hashicorp/setup-packer # Install Packer
          - opentofu/setup-opentofu # Install OpenTofu

          # ── Go ──────────────────────────────────────────────────────
          - goreleaser/goreleaser-action # GoReleaser
          - golangci/golangci-lint-action # golangci-lint

          # ── Rust ────────────────────────────────────────────────────
          - dtolnay/rust-toolchain # Install Rust toolchains
          - actions-rust-lang/setup-rust-toolchain # Rust toolchain setup

          # ── GitHub automation / releases ────────────────────────────
          - softprops/action-gh-release # Publish GitHub releases
          - peter-evans/find-comment # Find issue/PR comments
          - peter-evans/create-or-update-comment # Manage issue/PR comments
          - peter-evans/create-pull-request # Create pull requests

          # ── Package managers ────────────────────────────────────────
          - Homebrew/actions/setup-homebrew # Configure Homebrew

          # ── Signing ─────────────────────────────────────────────────
          - crazy-max/ghaction-import-gpg # Import GPG signing keys

    # ===========================================
    # Container images must not use forbidden tags
    # ===========================================
    # Same control as GitLab; values are GitHub-side. Pinning by digest
    # protects against tag-retag supply-chain attacks. The forbidden tag
    # list catches the common cases of mutable references.
    containerImageMustNotUseForbiddenTags:
      enabled: true
      tags:
        - latest
        - dev
        - development
        - staging
        - main
        - master
      # When true, ALL images must be pinned by digest (e.g.,
      # alpine@sha256:...). Takes precedence over the forbidden tags
      # list — any image not using an immutable digest reference is
      # flagged.
      containerImagesMustBePinnedByDigest: true

    # ===========================================
    # Pipeline must not use Docker-in-Docker
    # ===========================================
    # Workflows on GitHub-hosted runners that spin up `docker:dind`
    # services have the same privilege-escalation risk as on GitLab.
    # detectInsecureDaemon also flags plaintext DOCKER_HOST and empty
    # DOCKER_TLS_CERTDIR values.
    pipelineMustNotUseDockerInDocker:
      enabled: true
      detectInsecureDaemon: true

    # ===========================================
    # Pipeline must not execute unverified scripts
    # ===========================================
    # Scans every workflow `run:` step for pipe-to-shell, download-then-exec,
    # redirect-then-exec, and base64-obfuscated payloads.
    # Maps to OWASP CICD-SEC-3 / CICD-SEC-8.
    pipelineMustNotExecuteUnverifiedScripts:
      enabled: true
      trustedUrls: []
      # - https://internal-artifacts.example.com/*

    # ===========================================
    # Reusable workflows must not inherit secrets
    # ===========================================
    # Detects `jobs.<name>.secrets: inherit` calls. Inherit forwards
    # every secret visible to the caller — repo, organisation,
    # environment — to the reusable workflow regardless of what it
    # actually needs. Use an explicit secrets map instead.
    reusableWorkflowsMustNotInheritSecrets:
      enabled: true

    # ===========================================
    # Checkout must not persist credentials
    # ===========================================
    # By default `actions/checkout` writes the GITHUB_TOKEN into the
    # cloned repository's `.git/config`, where it survives for the rest
    # of the job. On its own that is latent (ISSUE-307, low): the token
    # dies with the job. It becomes a demonstrable leak (ISSUE-310,
    # high) when a later step uploads a `.git`-inclusive path as an
    # artifact, which is downloadable. The fix is a one-liner for both:
    # `with: persist-credentials: false`.
    checkoutMustNotPersistCredentials:
      enabled: true

    # ===========================================
    # Workflow must not export the entire secrets context
    # ===========================================
    # Flags a job that serialises the whole `secrets` context with
    # toJson(secrets) into a run script, an env binding, or an action
    # `with:` input. The JSON blob carries every secret the job can see;
    # GitHub log redaction masks known secret values, not a JSON string
    # derived from them, so a single echo leaks the lot. Reference each
    # secret by name instead.
    workflowMustNotExportEntireSecretsContext:
      enabled: true

    # ===========================================
    # Security jobs must not be weakened
    # ===========================================
    # Jobs matching the security-scanner naming patterns must not be
    # neutralised via `continue-on-error: true` (the GitHub equivalent of
    # GitLab's allow_failure: true) or manual-dispatch-only triggers.
    # Maps to OWASP CICD-SEC-4.
    #
    # Each pattern is a glob matched against the job name plumber builds:
    #   <workflow filename, .yml/.yaml stripped>/<job id in YAML>
    # e.g. .github/workflows/codeql.yml + jobs.analyze -> codeql/analyze.
    # The defaults ship wildcard-wrapped since plumber doesn't know your
    # workflow-file convention; drop the wildcards for tighter matching.
    securityJobsMustNotBeWeakened:
      enabled: true
      securityJobPatterns:
        - "*codeql*"
        - "*dependency-review*"
        - "*trufflehog*"
        - "*gitleaks*"
        - "*osv-scanner*"
        - "*semgrep*"
        - "*trivy*"
        - "*snyk*"
        - "*-sast"
        - "*-sast-*"
        - "*-scan"
        - "*scan*"
        - "*-security"
        - "*-security-*"
        - "*-audit"
        - "*-audit-*"
        - "*secret*detect*"
        - "*detect*secret*"
      allowFailureMustBeFalse:
        enabled: true
      rulesMustNotBeRedefined:
        enabled: true
      whenMustNotBeManual:
        enabled: true

    # ===========================================
    # Workflow must not inject user input in scripts
    # ===========================================
    # Catches the canonical script-injection class: `${{ github.event.* }}`
    # / `${{ github.head_ref }}` / `${{ github.actor }}` interpolated
    # directly into a `run:` shell. Attacker-controlled values like PR
    # title or branch name can break out of the string and execute
    # arbitrary commands with the job's secrets. Bind through `env:` first.
    workflowMustNotInjectUserInputInScripts:
      enabled: true

    # ===========================================
    # Workflow must not write untrusted content to $GITHUB_ENV / $GITHUB_PATH
    # ===========================================
    # Flags a `run:` step that writes an attacker-controlled expression
    # (${{ github.event.* }} / ${{ github.head_ref }}) into $GITHUB_ENV or
    # $GITHUB_PATH. Both files are sticky: every later step inherits the
    # variable or PATH entry, so an injected NODE_OPTIONS (or a front-loaded
    # PATH directory) hijacks later steps. Bind the value through `env:` and
    # reference the shell variable on the redirect line.
    workflowMustNotWriteUntrustedContentToGitHubEnv:
      enabled: true

    # ===========================================
    # Workflow must not use dangerous triggers
    # ===========================================
    # Flags `pull_request_target` and `workflow_run` triggers, which run
    # with the base repository's secrets while being influenceable by an
    # unprivileged caller. Combined with any user-content checkout this
    # becomes a direct exfiltration path. Use the standard `pull_request`
    # trigger unless secrets are required.
    workflowMustNotUseDangerousTriggers:
      enabled: true

    # ===========================================
    # pull_request_target must not check out PR head
    # ===========================================
    # Flags a `pull_request_target` workflow that checks out the pull-request
    # head (github.event.pull_request.head.sha or github.head_ref). Base-repo
    # secrets and fork-controlled code then run together — the tj-actions /
    # CVE-2025-30066 vector. Keep fork code under a plain `pull_request` trigger.
    pullRequestTargetMustNotCheckoutHead:
      enabled: true

    # ===========================================
    # Workflows must declare permissions
    # ===========================================
    # Workflows without an explicit `permissions:` block fall back to the
    # repo-wide GITHUB_TOKEN default — often `contents: write` or `read-all`.
    # Declaring `permissions: { contents: read }` at the workflow level
    # enforces least-privilege regardless of the repo default.
    workflowsMustDeclarePermissions:
      enabled: true

    # ===========================================
    # Branch must be protected (project governance)
    # ===========================================
    # Inspects repository settings via the GitHub branch-protection API.
    # The public `protected` flag is readable on any public repo (no admin
    # rights needed); full protection detail (allowForcePush,
    # codeOwnerApprovalRequired) requires a token with `repo` scope or
    # "Administration: read". Without scope the collector returns an empty
    # branch list and the rule emits no findings (degraded, no false positives).
    branchMustBeProtected:
      enabled: true
      defaultMustBeProtected: true
      namePatterns:
        - main
        - master
        - release/*
        - production
        - dev
      allowForcePush: false
      # Off by default (many projects don't use CODEOWNERS); turn on to require
      # code-owner approval on protected branches.
      codeOwnerApprovalRequired: false

    # ============================================================================
    # Workflows must include required actions
    # ============================================================================
    # Asserts that workflows under .github/workflows/ collectively reference a
    # set of required actions or reusable workflows (the GitHub counterpart of
    # pipelineMustIncludeComponent / pipelineMustIncludeTemplate).
    #
    # Disabled by default: there is no universal required-action list that
    # applies to every project. Enable per-org once you've settled on the
    # action set every repo is expected to wire up (e.g. a SAST action, an
    # SBOM generator, actions/attest-build-provenance).
    #
    # Two ways to define requirements (use one, not both):
    #
    # Option 1 — Expression syntax ('required'):
    #   required: myorg/sast-scan AND myorg/dependency-review
    #   required: (myorg/sast-scan AND myorg/secret-scan) OR myorg/full-security-suite
    #
    # Option 2 — Array syntax ('requiredGroups'):
    #   requiredGroups:
    #     - ["myorg/sast-scan", "myorg/dependency-review"]
    #     - ["myorg/full-security-suite"]
    workflowMustIncludeRequiredActions:
      enabled: false
      # required: myorg/sast-scan AND myorg/policy/.github/workflows/scan.yml
      requiredGroups: []

    # ===========================================
    # Workflow must not grant write-all permissions
    # ===========================================
    # Flags workflows and jobs whose effective `permissions:` is the literal
    # `write-all` shortcut, which gives GITHUB_TOKEN every scope at once
    # (contents, packages, deployments, id-token, …). Any compromise in the
    # workflow then gets to do anything the repo allows. Workflow-level
    # `write-all` propagates to every job. Pair with
    # `workflowsMustDeclarePermissions` for the full least-privilege story.
    workflowMustNotGrantPermissionsWriteAll:
      enabled: true

    # ===========================================
    # Actions must not use ambiguous tag/branch refs
    # ===========================================
    # Flags `uses: owner/repo@ref` references whose symbolic name resolves
    # upstream as BOTH a tag and a branch. GitHub resolves tags first, so the
    # workflow runs the tagged commit today — but a tag deletion, rename, or
    # typo silently switches which revision executes. Pin to a 40-char commit
    # SHA to remove the ambiguity.
    #
    # Requires GitHub API auth: the collector probes both namespaces and
    # abstains without auth. The finding fires only on a confirmed double-hit.
    externalRefsMustNotCollide:
      enabled: true

    # ===========================================
    # Actions must not reference archived repositories
    # ===========================================
    # Flags `uses: owner/repo@ref` references whose upstream repository is
    # archived on GitHub. Archived repos no longer receive maintenance: open
    # vulnerabilities stay open, dependency bumps stop. Pinning by SHA does
    # not save the caller — the namespace can still be repopulated with new code.
    #
    # Requires GitHub API auth; without it the rule abstains (no finding).
    actionsMustNotBeArchived:
      enabled: true

    # ===========================================
    # Actions must pin commits that exist upstream
    # ===========================================
    # Flags `uses: owner/repo@<sha>` references pinned to a 40-character commit
    # SHA the upstream repository confirms does not exist: either a typo (the
    # runner silently falls back to the default branch) or a commit removed or
    # never pushed upstream.
    #
    # Fires ONLY when the API confirms the commit is absent from a repo Plumber
    # can read; an unverifiable SHA stays silent, so valid pins are never
    # flagged. Requires GitHub API auth; without it the rule abstains.
    actionRefsMustExistUpstream:
      enabled: true

    # ===========================================
    # Actions must not carry known CVEs
    # ===========================================
    # Cross-references every `uses: owner/repo@ref` against the GitHub Advisory
    # Database (`actions` ecosystem). Catches the published-CVE supply-chain
    # class — tj-actions/changed-files (CVE-2025-30066), reviewdog/action-setup,
    # unpatched actions/artifact. Semver-filtered so versions past the fix stay
    # silent. Requires GitHub API auth; without it the rule abstains.
    actionsMustNotCarryKnownCVEs:
      enabled: true

    # ===========================================
    # Actions must not execute mutable remote code
    # ===========================================
    # Flags a third-party action that, even pinned by commit SHA, fetches and
    # executes a script from a MOVING ref (main/master/HEAD) of another repo at
    # runtime. Pinning the action's own ref does not make its execution
    # immutable: the fetched code can change with nothing committed where the
    # pin can see it (e.g. anchore/scan-action running grype's main install.sh).
    # Requires GitHub API auth; config-free, toggle via `enabled`.
    actionsMustNotExecuteMutableRemoteCode:
      enabled: true

    # ===========================================
    # Release workflows must not restore an untrusted cache
    # ===========================================
    # Flags a release/publish job that restores a build cache whose key is not
    # scoped to the release ref. GitHub Actions caches are shared across
    # branches with a permissive fallback, so a PR run on any feature branch
    # can populate the same key a release job later restores, injecting
    # compromised artefacts into the published output (the May 2026 TanStack
    # vector). Weave github.ref_name / github.sha into the cache key, or disable
    # caching on publish paths.
    #
    # The action / script inventories below are configurable — extend them for
    # your own tooling instead of waiting for a plumber release.
    releaseWorkflowsMustNotRestoreUntrustedCache:
      enabled: true
      # Actions that publish/release artifacts (a job running one restores into
      # a published build). Add your org's own publish actions.
      publishActions:
        - pypa/gh-action-pypi-publish
        - JS-DevTools/npm-publish
        - gradle/publish-plugin
        - softprops/action-gh-release
        - ncipollo/release-action
        - goreleaser/goreleaser-action
        - crazy-max/ghaction-docker-buildx
        - changesets/action
      # Cache-restoring actions AND their per-action semantics. mode:
      #   always  — restores whenever present
      #   default — restores unless disableInput holds disableValue
      #   opt-in  — restores only when enableInput names a package manager
      #             (enableContains further requires that substring in the value)
      cacheActions:
        - {action: actions/cache, mode: always}
        - {action: actions/cache/restore, mode: always}
        - {action: Swatinem/rust-cache, mode: always}
        - {action: actions/setup-go, mode: default, disableInput: cache, disableValue: false}
        - {action: gradle/actions/setup-gradle, mode: default, disableInput: cache-disabled, disableValue: true}
        - {action: actions/setup-node, mode: opt-in, enableInput: cache}
        - {action: actions/setup-python, mode: opt-in, enableInput: cache}
        - {action: actions/setup-java, mode: opt-in, enableInput: cache}
        - {action: pnpm/action-setup, mode: opt-in, enableInput: cache}
        - {action: docker/build-push-action, mode: opt-in, enableInput: cache-from, enableContains: type=gha}
      # Shell commands (regex) that mark a job as release intent even under a
      # plain push/tag trigger with no publish action.
      publishScriptPatterns:
        - '(?i)(npm|pnpm|yarn|bun)\s+publish'
        - '(?i)cargo\s+publish'
        - '(?i)twine\s+upload'
        - '(?i)poetry\s+publish'
        - '(?i)gh\s+release\s+create'
        - '(?i)goreleaser\s+release'
        - '(?i)semantic-release'
        - '(?i)gradlew?\b[^\n]*\bpublish'
        - '(?i)\bmvnw?\b[^\n]*\bdeploy\b'
        - '(?i)dotnet\s+nuget\s+push'
        - '(?i)gem\s+push'
        - '(?i)docker\s+push'
      # Verification-only forms that veto a publish-script match on the same
      # run block — they never publish anything.
      publishScriptExcludePatterns:
        - '(?i)--dry-run'
        - '(?i)publishToMavenLocal'
      # Jobs to exempt from this control (glob on `<workflow-file>/<job-id>`).
      allowedJobs: []
        # - '*/lint'
        # - 'release-docs/*'

    # ===========================================
    # Pipeline must not enable debug trace
    # ===========================================
    # Flags workflows or jobs that set the GitHub Actions debug-trace toggles
    # to a truthy value (`true`, `1`, `yes`). When `ACTIONS_STEP_DEBUG` or
    # `ACTIONS_RUNNER_DEBUG` is enabled, the runner prints every environment
    # variable (including masked secrets) into the job log, bypassing masking
    # for the dump itself.
    pipelineMustNotEnableDebugTrace:
      enabled: true
      forbiddenVariables:
        - ACTIONS_STEP_DEBUG
        - ACTIONS_RUNNER_DEBUG